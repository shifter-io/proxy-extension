# Work areas of proxy-extension for orchd: one open task per area (GLOBAL 3.1). proxy-extension keeps
# no area table, so this map is derived from the tree and its generators. It is deliberately coarse:
# the extension's sources and its end-to-end suite change together, so they are one area,
# `extension`. Generators checked: scripts/render-readme.py renders README.md, e2e/README.md and
# shifter_docs/ into docs/, and CI's step "docs/ matches its Markdown sources" fails on any difference,
# so every one of its inputs and outputs is in `docs` (CI's change filter already counts e2e/README.md
# as documentation). Not CI-checked but kept inside one area too: build-icons.mjs writes public/icon/
# and build-geo-catalog.mjs writes src/lib/geo/, both in `extension`. The flags and fonts are separate.
# The npm manifest and lockfile, the TypeScript, WXT, PostCSS and Tailwind settings and CI are
# `shared`. The globs are pairwise disjoint and cover every tracked file. A path that matches no glob
# counts as area:shared, which conflicts with every area.
v = 1

[areas]
# the extension: background, popup, libraries, UI and styles (src/), its icons (public/icon/), the
# end-to-end suite with its own npm manifest, and the build and preview scripts
extension = [
    "src/**",
    "public/icon/**",
    "e2e/*.mjs",
    "e2e/package.json",
    "e2e/package-lock.json",
    "scripts/build-geo-catalog.mjs",
    "scripts/build-icons.mjs",
    "scripts/preview.mjs",
    "scripts/preview-shim.js",
]
# the static assets: country flags, and the fonts with their licence
assets = ["public/flags/**", "public/fonts/**"]
# documentation: every input and output of render-readme.py (README.md, e2e/README.md, shifter_docs/,
# docs/), build notes, licence and the readme header generator
docs = [
    "README.md",
    "e2e/README.md",
    "shifter_docs/**",
    "docs/**",
    "BUILD.html",
    "LICENSE",
    "scripts/render-readme.py",
    "scripts/generate-readme-header.py",
]
# workspace-wide: the npm manifest and lockfile, the TypeScript, WXT, PostCSS and Tailwind settings,
# the ignore list and CI; a change here merges alone
shared = [
    "package.json",
    "package-lock.json",
    "tsconfig.json",
    "wxt.config.ts",
    "postcss.config.cjs",
    "tailwind.config.cjs",
    ".gitignore",
    ".github/**",
]
