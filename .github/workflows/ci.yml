# Merge checks for every ready pull request and every merge-queue test, and a
# full run of main every 6 hours (README.md, "Continuous integration").
# Pushes to main run nothing: the queue already tested each merge.
#
# gate is the one job and the one required check. It runs on one fresh
# CI-SelfHosted server, [self-hosted, ci-8cpu] (a manual run may pick another
# size): setup once, then every check and end-to-end part at the same time
# (scripts/ci/parts.mjs, run by scripts/ci/run-parts.mjs). The servers admit
# only the maintainer's pull requests from branches of this repository and the
# maintainer's manual runs. Downloads and the npm cache persist between runs
# under $CI_CACHE_DIR/proxy-extension; the checkout and $RUNNER_TEMP do not.
#
# A draft pull request fails gate on GitHub's runner without starting a server.
# A pull request that touches only documentation runs only the docs part.
# Slow parts run only on merge-queue tests, scheduled runs and manual runs with
# slow. The live shifter.io check runs only on scheduled runs and manual runs
# with live; an outage there leaves gate green and opens one issue (outage).
# When gate fails on a scheduled run, or on a manual run with report_failure,
# report opens one issue (failure-issue.yml). report and outage run on
# GitHub's runner and never for a pull request or the queue.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      runner:
        description: The server size gate runs on.
        type: choice
        options: [ci-8cpu, ci-16cpu, ci-32cpu]
        default: ci-8cpu
      slow:
        description: Run the slow parts too, as the merge queue does.
        type: boolean
        default: false
      live:
        description: Run the live shifter.io check, as a scheduled run does.
        type: boolean
        default: false
      report_failure:
        description: Open an issue if this run fails, as a scheduled run does.
        type: boolean
        default: false

# A pull request's newer head cancels its older run; every other run has its
# own group, so manual runs and queue tests never replace each other.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # BUILD.html's toolchain; Node 24.21.0 ships npm 11.19.0.
  NODE_VERSION: 24.21.0
  NPM_VERSION: 11.19.0
  # The Firefox release puppeteer pins (puppeteer 25.16.0 in
  # e2e/package-lock.json: stable_158.0.1); bump both together. SHA-256 from
  # the release's SHA256SUMS on archive.mozilla.org.
  FIREFOX_VERSION: 158.0.1
  FIREFOX_SHA256: dce45470139242cf294eb6ada3d192a9bb334696842b02b71ade448a139eb41a
  # SHA-256 from the release's checksums file.
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  # Browsers come from the runner or the pinned download, never from npm.
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  npm_config_audit: 'false'
  npm_config_fund: 'false'
  npm_config_update_notifier: 'false'

jobs:
  gate:
    name: gate
    runs-on: ${{ github.event.pull_request.draft && fromJSON('["ubuntu-latest"]') || fromJSON(format('["self-hosted","{0}"]', inputs.runner || 'ci-8cpu')) }}
    timeout-minutes: 15
    outputs:
      live_outage: ${{ steps.live.outputs.outage }}
    steps:
      - name: Draft pull request
        if: github.event.pull_request.draft
        run: |
          echo "::error::draft: nothing is checked until it is ready"
          exit 1
      # A pull request's checkout is the request merged into its base, so
      # HEAD^1 is the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: What changed
        env:
          EVENT: ${{ github.event_name }}
          SLOW_INPUT: ${{ inputs.slow }}
          LIVE: ${{ github.event_name == 'schedule' || inputs.live }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only --no-renames HEAD^1 HEAD)
            docs='^(README\.md|LICENSE|BUILD\.html|docs/.+|shifter_docs/.+|e2e/README\.md)$'
            if [ -n "$files" ] && ! grep -qvE "$docs" <<< "$files"; then code=false; fi
            {
              echo "Docs-only rule: every changed file matches \`$docs\`."
              echo
              echo "Changed files:"
              echo
              echo '```'
              echo "$files"
              echo '```'
              echo
              if [ "$code" = false ]; then echo "Docs only: only the docs part runs."; else echo "Not docs only: every part runs."; fi
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "$EVENT: every part runs." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          slow=false
          if [ "$EVENT" = merge_group ] || [ "$EVENT" = schedule ] || [ "$SLOW_INPUT" = true ]; then slow=true; fi
          if [ "$LIVE" != true ]; then echo "live check: scheduled runs only" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          { echo "CODE=$code"; echo "SLOW=$slow"; } | tee -a "$GITHUB_ENV"
      - name: Use the runner's cache
        run: |
          : "${CI_CACHE_DIR:?is not set; this job needs the self-hosted CI runners}"
          cache="$CI_CACHE_DIR/proxy-extension"
          mkdir -p "$cache/npm" "$cache/puppeteer" "$cache/tools"
          # Partial downloads a cancelled run left behind.
          find "$cache/tools" -mindepth 1 -maxdepth 1 -name '.*' -mmin +60 -exec rm -rf {} +
          {
            echo "npm_config_cache=$cache/npm"
            echo "PUPPETEER_CACHE_DIR=$cache/puppeteer"
            echo "TMPDIR=$RUNNER_TEMP"
          } >> "$GITHUB_ENV"
      - name: Toolchain
        if: env.CODE == 'true'
        run: |
          echo "node $(node --version), npm $(npm --version)"
          if [ "$(node --version)" != "v$NODE_VERSION" ] || [ "$(npm --version)" != "$NPM_VERSION" ]; then
            echo "::error::expected node v$NODE_VERSION and npm $NPM_VERSION"; exit 1
          fi
      - name: actionlint ${{ env.ACTIONLINT_VERSION }}
        if: env.CODE == 'true'
        run: |
          tools="$CI_CACHE_DIR/proxy-extension/tools"
          dir="$tools/actionlint-$ACTIONLINT_VERSION"
          if [ ! -x "$dir/actionlint" ]; then
            tmp=$(mktemp -d "$tools/.actionlint-XXXXXX")
            curl -fsSL --retry 3 -o "$tmp/a.tar.gz" \
              "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
            echo "$ACTIONLINT_SHA256  $tmp/a.tar.gz" | sha256sum -c --quiet -
            tar -C "$tmp" -xzf "$tmp/a.tar.gz" actionlint
            rm -f "$tmp/a.tar.gz"
            rm -rf "$dir" && mv -T "$tmp" "$dir"
          fi
          find "$tools" -mindepth 1 -maxdepth 1 -name 'actionlint-*' ! -name "actionlint-$ACTIONLINT_VERSION" -exec rm -rf {} +
          echo "ACTIONLINT=$dir/actionlint" >> "$GITHUB_ENV"
      - name: Firefox ${{ env.FIREFOX_VERSION }}
        if: env.CODE == 'true'
        run: |
          tools="$CI_CACHE_DIR/proxy-extension/tools"
          dir="$tools/firefox-$FIREFOX_VERSION"
          if [ ! -x "$dir/firefox/firefox" ]; then
            tmp=$(mktemp -d "$tools/.firefox-XXXXXX")
            curl -fsSL --retry 3 -o "$tmp/firefox.tar.xz" \
              "https://archive.mozilla.org/pub/firefox/releases/$FIREFOX_VERSION/linux-x86_64/en-US/firefox-$FIREFOX_VERSION.tar.xz"
            echo "$FIREFOX_SHA256  $tmp/firefox.tar.xz" | sha256sum -c --quiet -
            tar -C "$tmp" -xJf "$tmp/firefox.tar.xz"
            rm -f "$tmp/firefox.tar.xz"
            rm -rf "$dir" && mv -T "$tmp" "$dir"
          fi
          find "$tools" -mindepth 1 -maxdepth 1 -name 'firefox-*' ! -name "firefox-$FIREFOX_VERSION" -exec rm -rf {} +
          # Firefox loads GTK 3 and X11 libraries even when headless. Its own
          # libraries (NSS included) sit next to libxul.so.
          missing=$(LD_LIBRARY_PATH="$dir/firefox" ldd "$dir/firefox/libxul.so" | awk '/not found/')
          [ -z "$missing" ] || { echo "$missing"; echo "::error::this runner lacks the system libraries Firefox needs (listed above)"; exit 1; }
          "$dir/firefox/firefox" --version
          echo "FIREFOX_BIN=$dir/firefox/firefox" >> "$GITHUB_ENV"
      - name: Chrome for Testing from the runner
        if: env.CODE == 'true'
        run: |
          bin=$(readlink -f "$(command -v google-chrome)")
          version=$("$bin" --version)
          echo "$bin: $version"
          [[ "$version" == *"Chrome for Testing"* ]] || { echo "::error::$bin is not Chrome for Testing"; exit 1; }
          echo "CHROME_BIN=$bin" >> "$GITHUB_ENV"
      - name: npm ci, and npm ci in e2e/ (without browser downloads), side by side
        if: env.CODE == 'true'
        run: |
          npm ci &
          root=$!
          (cd e2e && npm ci --ignore-scripts) &
          e2e=$!
          failed=0
          wait "$root" || { echo "::error::npm ci failed"; failed=1; }
          wait "$e2e" || { echo "::error::npm ci in e2e/ failed"; failed=1; }
          exit "$failed"
      - name: Checks and tests in parallel
        run: |
          args=(--parts scripts/ci/parts.mjs --logs "$RUNNER_TEMP/parts")
          if [ "$SLOW" = true ]; then args+=(--slow); fi
          if [ "$CODE" != true ]; then args+=(--only docs); fi
          node scripts/ci/run-parts.mjs "${args[@]}"
      - name: Live check against shifter.io (scheduled runs only)
        id: live
        if: github.event_name == 'schedule' || inputs.live
        run: node scripts/ci/live-check.mjs
      - name: Install, builds and tests leave the tree clean
        run: |
          status=$(git status --porcelain)
          [ -z "$status" ] || { echo "$status"; echo "::error::npm ci, a build or a test changed files or wrote outside ignored paths"; exit 1; }

  # A failed scheduled run opens one issue, or names the open one. It is not
  # a required check.
  report:
    name: report
    needs: gate
    if: always() && needs.gate.result != 'success' && (github.event_name == 'schedule' || inputs.report_failure)
    permissions:
      issues: write
    uses: ./.github/workflows/failure-issue.yml
    with:
      title: Full CI run failed on ${{ github.ref_name }}
      summary: A scheduled full CI run failed. Close this issue when the next scheduled run is green.

  # shifter.io did not answer the live check: gate stays green and one issue
  # says so (failure-issue.yml reuses an open one with the same title).
  outage:
    name: outage
    needs: gate
    if: always() && needs.gate.outputs.live_outage == 'true'
    permissions:
      issues: write
    uses: ./.github/workflows/failure-issue.yml
    with:
      title: "External outage: shifter.io did not answer the scheduled live check"
      summary: "External outage, not a code failure: shifter.io gave no answer, a 5xx or a 429 when the scheduled run checked it, so the live check did not run. Pull requests and the merge queue never run this check, so nothing is blocked. Close this issue when a scheduled run's live check passes again."
